name: Bank correctness
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bankpilot_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bankpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankpilot_test -d bankpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bankpilot_test:ci-test-only@127.0.0.1:5432/bankpilot_test
      PASSWORD_PEPPER: ci-test-only-never-use-in-production
      BANKPILOT_DB_TESTS: "1"
      BANKPILOT_DEMO_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply all migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      # Invariants assert production-shaped data (e.g. every customer has
      # credentials). Run them on the freshly migrated database, before the
      # test suites insert deliberately incomplete fixture customers.
      - name: Check bank invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/invariants.sql
      - run: npm run lint
      - run: npm test -- --no-file-parallelism
      - run: bash scripts/test-migrate-stdin.sh
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BANKPILOT_PUBLIC_URL: http://localhost:3109
